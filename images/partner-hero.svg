<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice">
  <!-- 파트너 페이지 메인 일러스트 (임시) — 밤하늘 아래 언덕에 함께 앉은 사람들 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3654"/>
      <stop offset=".55" stop-color="#2F5077"/>
      <stop offset=".85" stop-color="#5B8DB0"/>
      <stop offset="1" stop-color="#8FB4CF"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1480 210) scale(260)">
      <stop offset="0" stop-color="#F4F9FC" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#D6E6F0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#D6E6F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DB0"/>
      <stop offset="1" stop-color="#3E6A90"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6487"/>
      <stop offset="1" stop-color="#2A4A6E"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25425F"/>
      <stop offset="1" stop-color="#172B43"/>
    </linearGradient>
    <symbol id="st" viewBox="-12 -12 24 24"><path d="M0-11Q1.6-1.6 11 0Q1.6 1.6 0 11Q-1.6 1.6-11 0Q-1.6-1.6 0-11Z" fill="#F4F9FC"/></symbol>
    <!-- 앉아 있는 사람 실루엣 -->
    <g id="sit">
      <circle cx="0" cy="-58" r="11"/>
      <path d="M-13-44c-6 8-8 22-8 34 0 6 3 10 9 10h36c6 0 8-4 6-8l-10-6c-4-2-8-2-12-2h-6c0-10-1-20-5-28-3-4-7-6-10-6z"/>
    </g>
    <g id="sitBack">
      <circle cx="0" cy="-60" r="11.5"/>
      <path d="M-15-46c-5 10-7 26-7 38 0 5 3 8 8 8h28c5 0 8-3 8-8 0-12-2-28-7-38-3-5-8-7-15-7s-12 2-15 7z"/>
    </g>
  </defs>

  <rect width="1920" height="800" fill="url(#sky)"/>
  <rect width="1920" height="800" fill="url(#moonGlow)"/>

  <!-- 달 -->
  <circle cx="1480" cy="210" r="46" fill="#F4F9FC" opacity=".92"/>
  <circle cx="1498" cy="198" r="44" fill="#2F5077" opacity=".18"/>

  <!-- 궤도 (브랜드 모티프) -->
  <ellipse cx="1480" cy="210" rx="190" ry="54" fill="none" stroke="#D6E6F0" stroke-opacity=".35" stroke-width="1.4" transform="rotate(-14 1480 210)"/>
  <circle cx="1662" cy="164" r="4" fill="#F4F9FC" opacity=".8"/>

  <!-- 별 -->
  <g opacity=".85">
    <use href="#st" x="190" y="90" width="22" height="22"/>
    <use href="#st" x="420" y="190" width="12" height="12"/>
    <use href="#st" x="640" y="70" width="16" height="16"/>
    <use href="#st" x="860" y="160" width="10" height="10"/>
    <use href="#st" x="1060" y="60" width="26" height="26"/>
    <use href="#st" x="1250" y="130" width="12" height="12"/>
    <use href="#st" x="1740" y="90" width="18" height="18"/>
    <use href="#st" x="1820" y="260" width="10" height="10"/>
    <use href="#st" x="980" y="270" width="12" height="12"/>
    <use href="#st" x="300" y="300" width="10" height="10"/>
  </g>
  <g fill="#F4F9FC">
    <circle cx="90" cy="200" r="1.6" opacity=".7"/><circle cx="350" cy="60" r="1.4" opacity=".6"/>
    <circle cx="520" cy="120" r="1.2" opacity=".7"/><circle cx="740" cy="230" r="1.6" opacity=".5"/>
    <circle cx="930" cy="100" r="1.3" opacity=".7"/><circle cx="1150" cy="210" r="1.5" opacity=".6"/>
    <circle cx="1330" cy="60" r="1.2" opacity=".7"/><circle cx="1640" cy="330" r="1.4" opacity=".5"/>
    <circle cx="1880" cy="140" r="1.6" opacity=".7"/><circle cx="560" cy="300" r="1.2" opacity=".5"/>
    <circle cx="1200" cy="320" r="1.2" opacity=".5"/><circle cx="60" cy="40" r="1.4" opacity=".6"/>
    <circle cx="1560" cy="40" r="1.3" opacity=".7"/><circle cx="1010" cy="360" r="1.1" opacity=".5"/>
  </g>
  <!-- 별똥별 -->
  <path d="M760 120l120 42" stroke="#F4F9FC" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 언덕 -->
  <path d="M0 520C220 470 420 470 640 500S1060 560 1280 520 1700 450 1920 480V800H0Z" fill="url(#hillFar)" opacity=".75"/>
  <path d="M0 600C260 560 520 580 780 610S1240 640 1500 590 1800 540 1920 560V800H0Z" fill="url(#hillMid)"/>
  <path d="M0 700C300 670 560 690 860 690S1180 600 1420 560 1760 560 1920 590V800H0Z" fill="url(#hillNear)"/>

  <!-- 언덕 위 사람들 -->
  <g fill="#132439">
    <use href="#sitBack" x="1260" y="606"/>
    <use href="#sit" x="1322" y="594" transform="scale(-1 1) translate(-2644 0)"/>
    <use href="#sitBack" x="1392" y="582"/>
    <use href="#sit" x="1452" y="574"/>
    <use href="#sitBack" x="1516" y="568"/>
    <use href="#sit" x="1578" y="566" transform="scale(-1 1) translate(-3156 0)"/>
    <use href="#sitBack" x="1640" y="568"/>
  </g>

  <!-- 반딧불 -->
  <g fill="#EFE3D3">
    <circle cx="1180" cy="560" r="2.4" opacity=".8"/><circle cx="1720" cy="520" r="2" opacity=".7"/>
    <circle cx="1350" cy="500" r="1.8" opacity=".6"/><circle cx="1600" cy="480" r="2.2" opacity=".7"/>
    <circle cx="980" cy="640" r="2" opacity=".6"/><circle cx="1800" cy="610" r="1.8" opacity=".6"/>
  </g>
</svg>
